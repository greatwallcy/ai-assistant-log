<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="tvWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D5B8"/>
      <stop offset="100%" stop-color="#D4BC96"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="430" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#2C3E50">电视柜 · 两种方案对比</text>

  <!-- ====== PLAN A: Low Cabinet ====== -->
  <text x="215" y="75" text-anchor="middle" font-size="18" font-weight="bold" fill="#E67E22">方案A：矮柜款（推荐）</text>
  <text x="215" y="95" text-anchor="middle" font-size="12" fill="#95A5A6">空间通透 · H=500mm</text>

  <!-- Wall -->
  <rect x="30" y="115" width="370" height="400" rx="3" fill="#F5F5F5" stroke="#BDC3C7" stroke-width="1"/>
  <text x="40" y="135" font-size="10" fill="#BDC3C7">电视墙</text>

  <!-- TV on wall -->
  <rect x="105" y="140" width="180" height="110" rx="3" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>
  <rect x="112" y="147" width="166" height="96" rx="1" fill="#34495E"/>
  <text x="195" y="200" text-anchor="middle" font-size="14" fill="#7F8C8D">📺 电视壁挂</text>
  <!-- PVC pipe -->
  <rect x="188" y="252" width="14" height="80" rx="3" fill="#95A5A6" opacity="0.4"/>
  <text x="220" y="295" font-size="9" fill="#95A5A6">预埋50mm PVC管</text>

  <!-- Low Cabinet -->
  <rect x="45" y="380" width="340" height="120" rx="4" fill="url(#tvWood)" stroke="#A0845C" stroke-width="2"/>
  <!-- Device area (left) -->
  <rect x="50" y="385" width="100" height="70" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <rect x="60" y="395" width="40" height="15" rx="2" fill="#3498DB" opacity="0.4"/>
  <text x="80" y="406" text-anchor="middle" font-size="8" fill="#fff">机顶盒</text>
  <rect x="60" y="420" width="40" height="15" rx="2" fill="#E74C3C" opacity="0.3"/>
  <text x="80" y="431" text-anchor="middle" font-size="8" fill="#fff">路由器</text>
  <!-- Ventilation dots -->
  <circle cx="120" cy="400" r="2" fill="#BDC3C7"/>
  <circle cx="130" cy="400" r="2" fill="#BDC3C7"/>
  <circle cx="140" cy="400" r="2" fill="#BDC3C7"/>
  <text x="95" y="448" text-anchor="middle" font-size="9" fill="#A0764A">设备区（散热）</text>

  <!-- Open shelf (center) -->
  <rect x="155" y="385" width="80" height="70" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <rect x="165" y="395" width="20" height="25" rx="3" fill="#2ECC71" opacity="0.3"/>
  <rect x="190" y="400" width="15" height="20" rx="3" fill="#9B59B6" opacity="0.3"/>
  <rect x="210" y="392" width="12" height="28" rx="2" fill="#F39C12" opacity="0.3"/>
  <text x="195" y="448" text-anchor="middle" font-size="9" fill="#A0764A">开放格</text>

  <!-- Drawers (right) -->
  <rect x="240" y="385" width="140" height="33" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <circle cx="310" cy="401" r="4" fill="#C49455"/>
  <rect x="240" y="422" width="140" height="33" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <circle cx="310" cy="438" r="4" fill="#C49455"/>
  <text x="310" y="475" text-anchor="middle" font-size="9" fill="#A0764A">抽屉储物</text>

  <!-- Bottom void -->
  <rect x="45" y="502" width="340" height="35" rx="2" fill="#F0E6D6" stroke="#C49455" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="215" y="524" text-anchor="middle" font-size="10" fill="#A0764A">悬空 200mm · 扫地机通行</text>

  <!-- Sofa hint -->
  <rect x="100" y="560" width="190" height="40" rx="15" fill="#A8C8E0" opacity="0.4"/>
  <text x="195" y="585" text-anchor="middle" font-size="10" fill="#5B7FA5">🛋️ 沙发位置</text>
  <text x="195" y="605" text-anchor="middle" font-size="10" fill="#95A5A6">电视中心距地 1000-1200mm</text>

  <!-- ====== PLAN B: Full Wall ====== -->
  <text x="645" y="75" text-anchor="middle" font-size="18" font-weight="bold" fill="#3498DB">方案B：满墙柜（储物优先）</text>
  <text x="645" y="95" text-anchor="middle" font-size="12" fill="#95A5A6">收纳最大化 · 顶天立地</text>

  <!-- Wall -->
  <rect x="460" y="115" width="370" height="400" rx="3" fill="#F5F5F5" stroke="#BDC3C7" stroke-width="1"/>

  <!-- Full wall cabinet frame -->
  <rect x="470" y="125" width="350" height="380" rx="4" fill="#FAF3EB" stroke="#A0845C" stroke-width="2"/>

  <!-- Top row -->
  <rect x="473" y="128" width="107" height="90" rx="2" fill="url(#tvWood)" stroke="#A0845C" stroke-width="1"/>
  <text x="526" y="178" text-anchor="middle" font-size="10" fill="#8B6338">储物上柜</text>

  <!-- TV center area -->
  <rect x="583" y="140" width="124" height="75" rx="2" fill="#2C3E50" stroke="#1A252F" stroke-width="1.5"/>
  <text x="645" y="182" text-anchor="middle" font-size="11" fill="#7F8C8D">📺 电视</text>

  <rect x="710" y="128" width="107" height="90" rx="2" fill="url(#tvWood)" stroke="#A0845C" stroke-width="1"/>
  <text x="763" y="178" text-anchor="middle" font-size="10" fill="#8B6338">储物上柜</text>

  <!-- Middle row -->
  <rect x="473" y="222" width="107" height="120" rx="2" fill="url(#tvWood)" stroke="#A0845C" stroke-width="1"/>
  <text x="526" y="286" text-anchor="middle" font-size="10" fill="#8B6338">储物中柜</text>

  <rect x="583" y="222" width="124" height="120" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <!-- Device shelves -->
  <line x1="585" y1="260" x2="705" y2="260" stroke="#C49455" stroke-width="1"/>
  <line x1="585" y1="300" x2="705" y2="300" stroke="#C49455" stroke-width="1"/>
  <text x="645" y="250" text-anchor="middle" font-size="9" fill="#A0764A">机顶盒</text>
  <text x="645" y="290" text-anchor="middle" font-size="9" fill="#A0764A">路由器</text>
  <text x="645" y="330" text-anchor="middle" font-size="9" fill="#A0764A">开放格/设备</text>

  <rect x="710" y="222" width="107" height="120" rx="2" fill="url(#tvWood)" stroke="#A0845C" stroke-width="1"/>
  <text x="763" y="286" text-anchor="middle" font-size="10" fill="#8B6338">储物中柜</text>

  <!-- Bottom row: drawers -->
  <rect x="473" y="346" width="107" height="70" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <circle cx="526" cy="370" r="3" fill="#C49455"/>
  <circle cx="526" cy="395" r="3" fill="#C49455"/>
  <text x="526" y="408" text-anchor="middle" font-size="8" fill="#A0764A">抽屉</text>

  <rect x="583" y="346" width="124" height="70" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <circle cx="645" cy="370" r="3" fill="#C49455"/>
  <circle cx="645" cy="395" r="3" fill="#C49455"/>
  <text x="645" y="408" text-anchor="middle" font-size="8" fill="#A0764A">抽屉</text>

  <rect x="710" y="346" width="107" height="70" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1"/>
  <circle cx="763" cy="370" r="3" fill="#C49455"/>
  <circle cx="763" cy="395" r="3" fill="#C49455"/>
  <text x="763" y="408" text-anchor="middle" font-size="8" fill="#A0764A">抽屉</text>

  <!-- Side depth note -->
  <line x1="470" y1="440" x2="470" y2="460" stroke="#E74C3C" stroke-width="1.5"/>
  <line x1="580" y1="440" x2="580" y2="460" stroke="#E74C3C" stroke-width="1.5"/>
  <line x1="470" y1="455" x2="580" y2="455" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="525" y="452" text-anchor="middle" font-size="9" fill="#E74C3C">250-300mm（浅）</text>

  <!-- Bottom void -->
  <rect x="470" y="502" width="350" height="35" rx="2" fill="#F0E6D6" stroke="#C49455" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="645" y="524" text-anchor="middle" font-size="10" fill="#A0764A">底部悬空 200mm</text>

  <!-- Sofa hint -->
  <rect x="530" y="560" width="230" height="40" rx="15" fill="#A8C8E0" opacity="0.4"/>
  <text x="645" y="585" text-anchor="middle" font-size="10" fill="#5B7FA5">🛋️ 沙发位置</text>

  <!-- Summary notes -->
  <rect x="30" y="640" width="800" height="50" rx="5" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1"/>
  <text x="430" y="660" text-anchor="middle" font-size="12" fill="#2874A6" font-weight="bold">💡 核心要点</text>
  <text x="430" y="678" text-anchor="middle" font-size="11" fill="#5B7FA5">预埋50mm PVC管线 | 电视背后2-3个插座 | 设备区留散热 | 电视中心距地1000-1200mm | 满墙柜两侧深度缩减至250-300mm</text>
</svg>