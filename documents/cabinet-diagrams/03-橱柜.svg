<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="cabWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D5B8"/>
      <stop offset="100%" stop-color="#D4BC96"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D5D5D5"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#2C3E50">橱柜 · L型布局设计示意图</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#7F8C8D">120㎡ 厨房约6-8㎡ · 地柜深600mm · 吊柜深320mm</text>

  <!-- ====== Top View ====== -->
  <rect x="50" y="80" width="380" height="260" rx="5" fill="#FAFAFA" stroke="#BDC3C7" stroke-width="1"/>
  <text x="240" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495E">俯视图 · 黄金三角动线</text>

  <!-- Kitchen walls -->
  <rect x="70" y="110" width="340" height="210" rx="2" fill="none" stroke="#95A5A6" stroke-width="2"/>
  <text x="240" y="335" text-anchor="middle" font-size="10" fill="#BDC3C7">厨房空间</text>

  <!-- L-shaped cabinet - long arm (bottom) -->
  <rect x="80" y="250" width="320" height="60" rx="3" fill="#D4BC96" stroke="#A0845C" stroke-width="1.5"/>
  <text x="170" y="275" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">水槽</text>
  <rect x="150" y="255" width="40" height="50" rx="2" fill="#A8C8E0" opacity="0.5"/>
  <text x="245" y="285" text-anchor="middle" font-size="10" fill="#8B6338">备菜区 ≥600mm</text>
  <text x="360" y="275" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">灶台</text>
  <rect x="330" y="255" width="60" height="50" rx="2" fill="#E74C3C" opacity="0.2"/>

  <!-- L-shaped cabinet - short arm (right) -->
  <rect x="330" y="120" width="60" height="135" rx="3" fill="#D4BC96" stroke="#A0845C" stroke-width="1.5"/>
  <text x="360" y="175" text-anchor="middle" font-size="9" fill="#8B6338" transform="rotate(90,360,175)">冰箱旁储物</text>

  <!-- Triangle lines -->
  <line x1="130" y1="260" x2="240" y2="140" stroke="#E74C3C" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="240" y1="140" x2="360" y2="275" stroke="#E74C3C" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="360" y1="275" x2="130" y2="260" stroke="#E74C3C" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Triangle labels -->
  <text x="170" y="190" font-size="9" fill="#E74C3C">1.5m</text>
  <text x="310" y="200" font-size="9" fill="#E74C3C">1.8m</text>
  <text x="240" y="270" font-size="9" fill="#E74C3C">2.0m</text>

  <!-- Icons -->
  <circle cx="130" cy="260" r="12" fill="#3498DB" opacity="0.3"/>
  <text x="130" y="264" text-anchor="middle" font-size="10">💧</text>
  <circle cx="240" cy="140" r="12" fill="#95A5A6" opacity="0.3"/>
  <text x="240" y="144" text-anchor="middle" font-size="10">🧊</text>
  <circle cx="360" cy="275" r="12" fill="#E74C3C" opacity="0.3"/>
  <text x="360" y="279" text-anchor="middle" font-size="10">🔥</text>

  <text x="100" y="140" font-size="9" fill="#5B7FA5">水槽</text>
  <text x="210" y="135" font-size="9" fill="#5B7FA5">冰箱</text>
  <text x="365" y="250" font-size="9" fill="#5B7FA5">灶台</text>

  <!-- ====== Front View - Base Cabinets ====== -->
  <rect x="50" y="360" width="380" height="200" rx="5" fill="#FAFAFA" stroke="#BDC3C7" stroke-width="1"/>
  <text x="240" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495E">地柜正视图（灶台侧）</text>

  <!-- Countertop -->
  <rect x="60" y="395" width="360" height="18" rx="2" fill="url(#counter)" stroke="#95A5A6" stroke-width="1.5"/>
  <text x="240" y="408" text-anchor="middle" font-size="9" fill="#5B7FA5">石英石台面 H=850mm · 前挡水5mm · 后挡水30mm</text>

  <!-- 3 drawers (most practical) -->
  <rect x="60" y="415" width="115" height="48" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1.5"/>
  <circle cx="117" cy="439" r="3" fill="#A0845C"/>
  <text x="117" y="430" text-anchor="middle" font-size="8" fill="#A0764A">第一层抽屉</text>

  <rect x="60" y="467" width="115" height="48" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1.5"/>
  <circle cx="117" cy="491" r="3" fill="#A0845C"/>
  <text x="117" y="482" text-anchor="middle" font-size="8" fill="#A0764A">第二层抽屉</text>

  <rect x="60" y="519" width="115" height="30" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1.5"/>
  <circle cx="117" cy="534" r="3" fill="#A0845C"/>
  <text x="117" y="538" text-anchor="middle" font-size="8" fill="#A0764A">第三层抽屉</text>

  <!-- Center cabinet -->
  <rect x="180" y="415" width="115" height="134" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1.5"/>
  <line x1="182" y1="480" x2="293" y2="480" stroke="#C49455" stroke-width="1"/>
  <text x="237" y="455" text-anchor="middle" font-size="9" fill="#A0764A">开门柜</text>
  <text x="237" y="470" text-anchor="middle" font-size="9" fill="#A0764A">（锅具/大件）</text>
  <text x="237" y="510" text-anchor="middle" font-size="9" fill="#A0764A">层板可调</text>

  <!-- Water area cabinet -->
  <rect x="300" y="415" width="110" height="134" rx="2" fill="#FAF3EB" stroke="#C49455" stroke-width="1.5"/>
  <text x="355" y="440" text-anchor="middle" font-size="9" fill="#2874A6">水槽下方</text>
  <text x="355" y="460" text-anchor="middle" font-size="8" fill="#A0764A">净水器</text>
  <text x="355" y="480" text-anchor="middle" font-size="8" fill="#A0764A">垃圾处理器</text>
  <text x="355" y="500" text-anchor="middle" font-size="8" fill="#A0764A">小厨宝</text>
  <!-- 3 sockets -->
  <rect x="315" y="515" width="18" height="12" rx="2" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
  <rect x="345" y="515" width="18" height="12" rx="2" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
  <rect x="375" y="515" width="18" height="12" rx="2" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
  <text x="355" y="543" text-anchor="middle" font-size="8" fill="#D4AC0D">3个插座 + 防水底板</text>

  <!-- Kick plate -->
  <rect x="60" y="552" width="350" height="6" rx="1" fill="#C49455" opacity="0.5"/>
  <text x="235" y="558" text-anchor="middle" font-size="7" fill="#8B6338">踢脚线内凹50-80mm</text>

  <!-- ====== Front View - Wall Cabinets ====== -->
  <rect x="470" y="80" width="400" height="300" rx="5" fill="#FAFAFA" stroke="#BDC3C7" stroke-width="1"/>
  <text x="670" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495E">吊柜 + 油烟机正视图</text>

  <!-- Range hood -->
  <path d="M580,125 L660,125 L640,180 L600,180 Z" fill="#95A5A6" stroke="#7F8C8D" stroke-width="1.5"/>
  <text x="620" y="158" text-anchor="middle" font-size="10" fill="#fff">油烟机</text>
  <text x="620" y="200" text-anchor="middle" font-size="9" fill="#95A5A6">距灶台 650-750mm（顶吸）</text>

  <!-- Wall cabinet left -->
  <rect x="480" y="215" width="130" height="100" rx="3" fill="url(#cabWood)" stroke="#A0845C" stroke-width="1.5"/>
  <line x1="482" y1="265" x2="608" y2="265" stroke="#A0845C" stroke-width="1"/>
  <text x="545" y="245" text-anchor="middle" font-size="9" fill="#8B6338">调料/干货</text>
  <text x="545" y="290" text-anchor="middle" font-size="9" fill="#8B6338">清洁用品</text>

  <!-- Wall cabinet right -->
  <rect x="620" y="215" width="130" height="100" rx="3" fill="url(#cabWood)" stroke="#A0845C" stroke-width="1.5"/>
  <line x1="622" y1="265" x2="748" y2="265" stroke="#A0845C" stroke-width="1"/>
  <text x="685" y="245" text-anchor="middle" font-size="9" fill="#8B6338">不常用物品</text>
  <text x="685" y="290" text-anchor="middle" font-size="9" fill="#8B6338">下拉拉篮</text>

  <!-- LED strip -->
  <rect x="480" y="317" width="270" height="3" rx="1" fill="#F1C40F" opacity="0.8"/>
  <text x="480" y="333" font-size="9" fill="#F39C12">💡 吊柜底部灯带（照亮台面）</text>

  <!-- Counter below -->
  <rect x="480" y="340" width="270" height="12" rx="2" fill="url(#counter)" stroke="#95A5A6" stroke-width="1"/>
  <text x="615" y="350" text-anchor="middle" font-size="8" fill="#5B7FA5">台面 H=850mm</text>

  <!-- Height annotations -->
  <line x1="770" y1="125" x2="770" y2="215" stroke="#E74C3C" stroke-width="1.5"/>
  <polygon points="770,125 765,135 775,135" fill="#E74C3C"/>
  <polygon points="770,215 765,205 775,205" fill="#E74C3C"/>
  <text x="785" y="175" font-size="9" fill="#E74C3C">650-750</text>
  <text x="785" y="185" font-size="8" fill="#E74C3C">mm</text>

  <line x1="770" y1="215" x2="770" y2="317" stroke="#3498DB" stroke-width="1.5"/>
  <polygon points="770,215 765,225 775,225" fill="#3498DB"/>
  <polygon points="770,317 765,307 775,307" fill="#3498DB"/>
  <text x="788" y="270" font-size="9" fill="#3498DB">700-800</text>
  <text x="788" y="280" font-size="8" fill="#3498DB">mm</text>

  <!-- ====== Countertop Material ====== -->
  <rect x="470" y="395" width="400" height="175" rx="5" fill="#FAFAFA" stroke="#BDC3C7" stroke-width="1"/>
  <text x="670" y="415" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495E">台面选型对比</text>

  <!-- Material cards -->
  <rect x="480" y="425" width="120" height="60" rx="4" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="540" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#2874A6">石英石 ⭐推荐</text>
  <text x="540" y="462" text-anchor="middle" font-size="9" fill="#5B7FA5">硬度高·耐磨</text>
  <text x="540" y="477" text-anchor="middle" font-size="9" fill="#5B7FA5">400-800元/延米</text>

  <rect x="610" y="425" width="120" height="60" rx="4" fill="#FDEDEC" stroke="#F5B7B1" stroke-width="1.5"/>
  <text x="670" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">岩板</text>
  <text x="670" y="462" text-anchor="middle" font-size="9" fill="#95A5A6">颜值高·脆</text>
  <text x="670" y="477" text-anchor="middle" font-size="9" fill="#95A5A6">800-2000元/延米</text>

  <rect x="740" y="425" width="120" height="60" rx="4" fill="#F9EBEA" stroke="#D5D8DC" stroke-width="1.5"/>
  <text x="800" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F8C8D">不锈钢</text>
  <text x="800" y="462" text-anchor="middle" font-size="9" fill="#95A5A6">耐高温·划伤</text>
  <text x="800" y="477" text-anchor="middle" font-size="9" fill="#95A5A6">300-600元/延米</text>

  <!-- Key points -->
  <text x="490" y="510" font-size="11" fill="#2C3E50" font-weight="bold">⚡ 关键参数</text>
  <text x="490" y="530" font-size="10" fill="#5D6D7E">• 黄金三角：水槽→灶台→冰箱，三边之和 ≤6m</text>
  <text x="490" y="548" font-size="10" fill="#5D6D7E">• 台下盆 > 台上盆（好打理）</text>
  <text x="490" y="566" font-size="10" fill="#5D6D7E">• 台面上每 600mm 一个带开关插座</text>

  <!-- ====== Install Order ====== -->
  <rect x="50" y="590" width="820" height="170" rx="5" fill="#FEF9E7" stroke="#F9E79F" stroke-width="1.5"/>
  <text x="460" y="615" text-anchor="middle" font-size="14" font-weight="bold" fill="#7D6608">安装顺序</text>

  <!-- Steps -->
  <rect x="65" y="630" width="100" height="50" rx="5" fill="#F1C40F" opacity="0.2" stroke="#F1C40F" stroke-width="1"/>
  <text x="115" y="652" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">① 水电</text>
  <text x="115" y="670" text-anchor="middle" font-size="9" fill="#9A7D0A">预埋管线</text>
  <text x="115" y="680" text-anchor="middle" font-size="9" fill="#9A7D0A">插座定位</text>

  <text x="180" y="660" font-size="20" fill="#F1C40F">→</text>

  <rect x="200" y="630" width="100" height="50" rx="5" fill="#F1C40F" opacity="0.2" stroke="#F1C40F" stroke-width="1"/>
  <text x="250" y="652" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">② 柜体</text>
  <text x="250" y="670" text-anchor="middle" font-size="9" fill="#9A7D0A">地柜+吊柜</text>
  <text x="250" y="680" text-anchor="middle" font-size="9" fill="#9A7D0A">可调脚调平</text>

  <text x="315" y="660" font-size="20" fill="#F1C40F">→</text>

  <rect x="330" y="630" width="100" height="50" rx="5" fill="#F1C40F" opacity="0.2" stroke="#F1C40F" stroke-width="1"/>
  <text x="380" y="652" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">③ 台面</text>
  <text x="380" y="670" text-anchor="middle" font-size="9" fill="#9A7D0A">石英石/岩板</text>
  <text x="380" y="680" text-anchor="middle" font-size="9" fill="#9A7D0A">开孔精确</text>

  <text x="445" y="660" font-size="20" fill="#F1C40F">→</text>

  <rect x="460" y="630" width="100" height="50" rx="5" fill="#F1C40F" opacity="0.2" stroke="#F1C40F" stroke-width="1"/>
  <text x="510" y="652" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">④ 水槽灶</text>
  <text x="510" y="670" text-anchor="middle" font-size="9" fill="#9A7D0A">台下盆安装</text>
  <text x="510" y="680" text-anchor="middle" font-size="9" fill="#9A7D0A">灶台嵌入</text>

  <text x="575" y="660" font-size="20" fill="#F1C40F">→</text>

  <rect x="590" y="630" width="100" height="50" rx="5" fill="#F1C40F" opacity="0.2" stroke="#F1C40F" stroke-width="1"/>
  <text x="640" y="652" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">⑤ 电器</text>
  <text x="640" y="670" text-anchor="middle" font-size="9" fill="#9A7D0A">油烟机/烤箱</text>
  <text x="640" y="680" text-anchor="middle" font-size="9" fill="#9A7D0A">冰箱就位</text>

  <text x="705" y="660" font-size="20" fill="#F1C40F">→</text>

  <rect x="720" y="630" width="100" height="50" rx="5" fill="#2ECC71" opacity="0.2" stroke="#2ECC71" stroke-width="1"/>
  <text x="770" y="652" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E8449">⑥ 完成 ✅</text>
  <text x="770" y="670" text-anchor="middle" font-size="9" fill="#27AE60">调试检测</text>
  <text x="770" y="680" text-anchor="middle" font-size="9" fill="#27AE60">燃气检修口</text>

  <!-- Note -->
  <text x="460" y="710" text-anchor="middle" font-size="10" fill="#7D6608">⚠️ 燃气管不能包死在柜子里，必须留检修口</text>
</svg>