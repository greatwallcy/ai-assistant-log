  <!-- Right side panel: Key Specs -->
  <rect x="610" y="80" width="175" height="360" rx="5" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="697" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2874A6">关键参数</text>

  <line x1="625" y1="115" x2="770" y2="115" stroke="#AED6F1" stroke-width="1"/>

  <text x="625" y="138" font-size="11" fill="#2C3E50" font-weight="bold">📐 尺寸</text>
  <text x="625" y="158" font-size="10" fill="#5D6D7E">• 深度：250-300mm</text>
  <text x="625" y="176" font-size="10" fill="#5D6D7E">• 普通书间距：280-320mm</text>
  <text x="625" y="194" font-size="10" fill="#5D6D7E">• 大开本间距：≥350mm</text>
  <text x="625" y="212" font-size="10" fill="#5D6D7E">• 层板跨度：≤800mm</text>
  <text x="625" y="230" font-size="10" fill="#5D6D7E">• 层板厚度：≥18mm</text>

  <text x="625" y="260" font-size="11" fill="#2C3E50" font-weight="bold">🔧 设计</text>
  <text x="625" y="280" font-size="10" fill="#5D6D7E">• 32mm系统孔可调</text>
  <text x="625" y="298" font-size="10" fill="#5D6D7E">• 70%开放 + 30%有门</text>
  <text x="625" y="316" font-size="10" fill="#5D6D7E">• 每层灯带照明</text>
  <text x="625" y="334" font-size="10" fill="#5D6D7E">• 靠墙固定防倾倒</text>

  <text x="625" y="364" font-size="11" fill="#2C3E50" font-weight="bold">⚠️ 注意</text>
  <text x="625" y="384" font-size="10" fill="#5D6D7E">• 书很重，必须固定</text>
  <text x="625" y="402" font-size="10" fill="#5D6D7E">• 多层板优于实木</text>
  <text x="625" y="420" font-size="10" fill="#5D6D7E">  （抗弯性更好）</text>

