  <text x="697" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#148F77">开放 vs 有门</text>
  <!-- Pie chart -->
  <circle cx="660" cy="618" r="25" fill="#2ECC71" opacity="0.6"/>
  <path d="M660,593 A25,25 0 0,1 685,618 L660,618 Z" fill="#3498DB" opacity="0.6"/>
