  <text x="697" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#A04000">📚 容量估算</text>
  <text x="625" y="500" font-size="10" fill="#7D6608">宽2000mm书柜</text>
  <text x="625" y="518" font-size="10" fill="#7D6608">可放 300-500 本书</text>
  <text x="625" y="530" font-size="9" fill="#9A7D0A">（按普通书 14-18mm/本）</text>

