<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="440" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C3E50">电路施工工具与穿线方法</text>
  <text x="440" y="55" text-anchor="middle" font-size="12" fill="#7F8C8D">自装必备工具清单 + 穿线步骤图解</text>

  <!-- ====== LEFT: Tools ====== -->
  <rect x="25" y="75" width="410" height="350" rx="5" fill="#FAFAFA" stroke="#BDC3C7" stroke-width="1.5"/>
  <text x="230" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C3E50">🔧 电路施工必备工具</text>

  <!-- Tool categories -->
  <rect x="40" y="110" width="185" height="140" rx="4" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1"/>
  <text x="132" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2874A6">开槽工具</text>
  <text x="50" y="150" font-size="10" fill="#5D6D7E">① 墙面切割机（开槽机）</text>
  <text x="65" y="166" font-size="9" fill="#95A5A6">双片切割，精确控制深度</text>
  <text x="50" y="184" font-size="10" fill="#5D6D7E">② 电镐/冲击钻</text>
  <text x="65" y="200" font-size="9" fill="#95A5A6">凿除槽内水泥</text>
  <text x="50" y="218" font-size="10" fill="#5D6D7E">③ 角磨机（切割线管）</text>
  <text x="65" y="234" font-size="9" fill="#95A5A6">切割金属管/修整</text>

  <rect x="235" y="110" width="185" height="140" rx="4" fill="#FEF9E7" stroke="#F9E79F" stroke-width="1"/>
  <text x="327" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#7D6608">穿线工具</text>
  <text x="245" y="150" font-size="10" fill="#5D6D7E">④ 穿线器（钢丝引线器）</text>
  <text x="260" y="166" font-size="9" fill="#95A5A6">3-5m 长，弹性钢丝</text>
  <text x="245" y="184" font-size="10" fill="#5D6D7E">⑤ 弯管器（弹簧弯管器）</text>
  <text x="260" y="200" font-size="9" fill="#95A5A6">PVC管冷弯，不破坏管壁</text>
  <text x="245" y="218" font-size="10" fill="#5D6D7E">⑥ 管剪/PVC管割刀</text>
  <text x="260" y="234" font-size="9" fill="#95A5A6">快速切割 PVC 管</text>

  <rect x="40" y="258" width="185" height="150" rx="4" fill="#FDEDEC" stroke="#F5B7B1" stroke-width="1"/>
  <text x="132" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">接线工具</text>
  <text x="50" y="298" font-size="10" fill="#5D6D7E">⑦ 剥线钳（自动/手动）</text>
  <text x="65" y="314" font-size="9" fill="#95A5A6">剥除电线绝缘层</text>
  <text x="50" y="332" font-size="10" fill="#5D6D7E">⑧ 压线钳（液压/手动）</text>
  <text x="65" y="348" font-size="9" fill="#95A5A6">压接线鼻子/端子</text>
  <text x="50" y="366" font-size="10" fill="#5D6D7E">⑨ 电工胶布+热缩管</text>
  <text x="65" y="382" font-size="9" fill="#95A5A6">绝缘处理</text>
  <text x="50" y="398" font-size="10" fill="#5D6D7E">⑩ 万用表（必备！）</text>

  <rect x="235" y="258" width="185" height="150" rx="4" fill="#E8F8F5" stroke="#A3E4D7" stroke-width="1"/>
  <text x="327" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#148F77">辅助工具</text>
  <text x="245" y="298" font-size="10" fill="#5D6D7E">⑪ 墨斗（弹线定位）</text>
  <text x="260" y="314" font-size="9" fill="#95A5A6">开槽前弹线</text>
  <text x="245" y="332" font-size="10" fill="#5D6D7E">⑫ 水平尺/激光水平仪</text>
  <text x="260" y="348" font-size="9" fill="#95A5A6">保证开关/插座高度一致</text>
  <text x="245" y="366" font-size="10" fill="#5D6D7E">⑬ 管卡/扎带/线卡</text>
  <text x="260" y="382" font-size="9" fill="#95A5A6">固定线管和电线</text>
  <text x="245" y="398" font-size="10" fill="#5D6D7E">⑭ 绝缘手套+护目镜</text>

  <!-- ====== RIGHT: Wire Pulling Steps ====== -->
  <rect x="455" y="75" width="405" height="350" rx="5" fill="#FAFAFA" stroke="#BDC3C7" stroke-width="1.5"/>
  <text x="657" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C3E50">穿线步骤图解</text>

  <!-- Step 1 -->
  <circle cx="480" cy="130" r="14" fill="#E74C3C"/>
  <text x="480" y="135" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>
  <text x="502" y="135" font-size="12" font-weight="bold" fill="#2C3E50">布管</text>
  <text x="502" y="152" font-size="10" fill="#5D6D7E">线管沿槽固定，弯头用弯管器（弯曲半径≥6倍管径）</text>
  <text x="502" y="166" font-size="9" fill="#95A5A6">PVC管规格：16mm（照明）/ 20mm（插座）/ 25mm（空调）</text>

  <!-- Step 2 -->
  <circle cx="480" cy="195" r="14" fill="#F39C12"/>
  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>
  <text x="502" y="200" font-size="12" font-weight="bold" fill="#2C3E50">穿引线</text>
  <text x="502" y="217" font-size="10" fill="#5D6D7E">将穿线钢丝从一端穿入管内，从另一端拉出</text>
  <text x="502" y="231" font-size="9" fill="#95A5A6">长管（>3m）需要两端同时操作</text>

  <!-- Step 3 -->
  <circle cx="480" cy="260" r="14" fill="#F1C40F"/>
  <text x="480" y="265" text-anchor="middle" font-size="11" fill="#7D6608" font-weight="bold">3</text>
  <text x="502" y="265" font-size="12" font-weight="bold" fill="#2C3E50">绑线</text>
  <text x="502" y="282" font-size="10" fill="#5D6D7E">将电线头与钢丝引线绑牢（胶布缠紧，防止脱落）</text>
  <text x="502" y="296" font-size="9" fill="#95A5A6">多根线一起穿时，线头错开 5cm，减少阻力</text>

  <!-- Step 4 -->
  <circle cx="480" cy="325" r="14" fill="#2ECC71"/>
  <text x="480" y="330" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>
  <text x="502" y="330" font-size="12" font-weight="bold" fill="#2C3E50">拉线</text>
  <text x="502" y="347" font-size="10" fill="#5D6D7E">一人推送（入口端），一人牵引（出口端）</text>
  <text x="502" y="361" font-size="9" fill="#95A5A6">管内可涂滑石粉/润滑剂减少摩擦</text>
  <text x="502" y="375" font-size="9" fill="#E74C3C">⚠️ 每根管内不超过3根电线！</text>

  <!-- Step 5 -->
  <circle cx="480" cy="400" r="14" fill="#3498DB"/>
  <text x="480" y="405" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">5</text>
  <text x="502" y="405" font-size="12" font-weight="bold" fill="#2C3E50">留线头</text>
  <text x="502" y="422" font-size="10" fill="#5D6D7E">暗盒内预留 15cm 线头，方便后续接面板</text>

  <!-- Wire rules -->
  <rect x="465" y="435" width="385" height="50" rx="4" fill="#FDEDEC" stroke="#F5B7B1" stroke-width="1"/>
  <text x="480" y="455" font-size="11" fill="#E74C3C" font-weight="bold">⚠️ 穿线铁律</text>
  <text x="480" y="472" font-size="10" fill="#5D6D7E">① 管内线截面 ≤ 管截面的40%  ② 弯头≤2个  ③ 直管≤15m设拉线盒</text>

  <!-- ====== BOTTOM: Standards ====== -->
  <rect x="25" y="440" width="410" height="195" rx="5" fill="#F5EEF8" stroke="#D7BDE2" stroke-width="1.5"/>
  <text x="230" y="465" text-anchor="middle" font-size="15" font-weight="bold" fill="#7D3C98">📏 开关插座标准高度</text>

  <rect x="40" y="475" width="380" height="22" rx="2" fill="#9B59B6" opacity="0.1"/>
  <text x="50" y="491" font-size="10" fill="#5D6D7E" font-weight="bold">位置</text>
  <text x="200" y="491" font-size="10" fill="#5D6D7E" font-weight="bold">高度（距地面）</text>
  <text x="330" y="491" font-size="10" fill="#5D6D7E" font-weight="bold">备注</text>

  <text x="50" y="512" font-size="10" fill="#5D6D7E">普通开关</text>
  <text x="200" y="512" font-size="10" fill="#5D6D7E">1300-1400mm</text>
  <text x="330" y="512" font-size="10" fill="#95A5A6">门边15cm</text>

  <text x="50" y="532" font-size="10" fill="#5D6D7E">普通插座</text>
  <text x="200" y="532" font-size="10" fill="#5D6D7E">300mm</text>
  <text x="330" y="532" font-size="10" fill="#95A5A6">距地30cm</text>

  <text x="50" y="552" font-size="10" fill="#5D6D7E">床头插座</text>
  <text x="200" y="552" font-size="10" fill="#5D6D7E">700-800mm</text>
  <text x="330" y="552" font-size="10" fill="#95A5A6">高于床头柜</text>

  <text x="50" y="572" font-size="10" fill="#5D6D7E">厨房台面插座</text>
  <text x="200" y="572" font-size="10" fill="#5D6D7E">1200-1300mm</text>
  <text x="330" y="572" font-size="10" fill="#95A5A6">台面上方15cm</text>

  <text x="50" y="592" font-size="10" fill="#5D6D7E">电视墙插座</text>
  <text x="200" y="592" font-size="10" fill="#5D6D7E">100-300mm / 1100mm</text>
  <text x="330" y="592" font-size="10" fill="#95A5A6">柜内+电视背后</text>

  <text x="50" y="612" font-size="10" fill="#5D6D7E">空调插座</text>
  <text x="200" y="612" font-size="10" fill="#5D6D7E">1800-2000mm</text>
  <text x="330" y="612" font-size="10" fill="#95A5A6">挂机上方</text>

  <text x="50" y="632" font-size="10" fill="#5D6D7E">洗衣机插座</text>
  <text x="200" y="632" font-size="10" fill="#5D6D7E">1200mm</text>
  <text x="330" y="632" font-size="10" fill="#95A5A6">洗衣机上方</text>

  <!-- Budget -->
  <rect x="455" y="498" width="405" height="137" rx="5" fill="#FEF9E7" stroke="#F9E79F" stroke-width="1.5"/>
  <text x="657" y="522" text-anchor="middle" font-size="15" font-weight="bold" fill="#7D6608">💰 120㎡ 电路材料预算</text>
  <text x="470" y="545" font-size="10" fill="#5D6D7E">• 电线（BV/BVR）：约 800-1200m  →  1500-2500元</text>
  <text x="470" y="563" font-size="10" fill="#5D6D7E">• PVC线管：约 300-400m  →  500-800元</text>
  <text x="470" y="581" font-size="10" fill="#5D6D7E">• 暗盒（86型）：50-70个  →  200-400元</text>
  <text x="470" y="599" font-size="10" fill="#5D6D7E">• 配电箱+空开漏保：12-16回路  →  600-1500元</text>
  <text x="470" y="617" font-size="10" fill="#5D6D7E">• 开关面板+插座：50-70个  →  800-3000元（看品牌）</text>
  <text x="470" y="630" font-size="10" fill="#7D6608" font-weight="bold">• 电路材料合计：约 3600-8200元（中档）</text>
</svg>